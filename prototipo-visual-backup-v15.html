    .icon-btn:hover{color:var(--ink);border-color:var(--ink-faint);}
    .edit-textarea{width:100%;min-height:100px;margin:.4rem 0 .7rem;}
    .btn-sm{padding:.4rem .85rem;font-size:.82rem;}
    .chip-row{display:flex;flex-wrap:wrap;gap:.4rem;}
    .chip{background:var(--panel-2);border:1px solid var(--border);border-radius:999px;
      padding:.22rem .68rem;font-size:.73rem;color:var(--ink-dim);}
    .chip-tema{color:var(--orange-text);border-color:rgba(255,191,94,.45);}
    .chip-paso{color:var(--olive-text);border-color:rgba(205,227,104,.5);}
    .empty-state{color:var(--ink-faint);font-size:.88rem;padding:2.2rem 0;text-align:center;}

    .voice-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;}
    .mic-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--panel-2);
      color:var(--ink);font-size:1.05rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .mic-btn.recording{background:var(--pink);color:var(--on-accent);animation:pulse 1.3s infinite;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(202,67,233,.5);}70%{box-shadow:0 0 0 9px rgba(202,67,233,0);}100%{box-shadow:0 0 0 0 rgba(202,67,233,0);}}
    @media (prefers-reduced-motion: reduce){.mic-btn.recording{animation:none;}}
    .voice-hint{font-size:.79rem;color:var(--ink-faint);}
    .duracion-field{max-width:200px;}
    .form-actions{display:flex;gap:.65rem;margin-top:1.15rem;flex-wrap:wrap;}
    .summary-preview{background:var(--well-bg);border:1px dashed var(--olive-text);border-radius:12px;
      padding:1rem 1.1rem;margin-top:1.2rem;}
    .summary-preview h4{font-size:.86rem;color:var(--olive-text);text-transform:uppercase;letter-spacing:.03em;}
    .summary-preview p{font-size:.9rem;line-height:1.55;}

    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem;margin-bottom:2rem;}
    .stat-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:1.15rem 1.25rem;}
    .stat-card .value{font-family:var(--font-title);font-size:1.9rem;font-weight:800;color:var(--orange-text);
      font-variant-numeric:tabular-nums;}
    .stat-card .label{font-size:.8rem;color:var(--ink-dim);margin-top:.25rem;}
    .hotspot-row{display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem;}
    .hotspot-row .bar-track{flex:1;height:8px;border-radius:999px;background:var(--well-bg);overflow:hidden;}
    .hotspot-row .bar-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--orange));}
    .hotspot-row .label{width:230px;font-size:.84rem;flex-shrink:0;}
    .hotspot-row .count{width:26px;text-align:right;font-size:.8rem;color:var(--ink-faint);
      font-variant-numeric:tabular-nums;}

    .toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);background:var(--panel-3);
      border:1px solid var(--border);padding:.65rem 1.1rem;border-radius:10px;font-size:.84rem;z-index:50;
      box-shadow:0 12px 30px -10px rgba(0,0,0,.55);}
    .toast.error{border-color:var(--cerrado-text);color:var(--cerrado-text);}

    .modal-overlay{position:fixed;inset:0;z-index:60;background:rgba(10,10,14,.55);
      display:flex;align-items:center;justify-content:center;padding:1.5rem;}
    .modal-dialog{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
      width:100%;max-width:580px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);}
    .modal-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;
      padding:1.1rem 1.3rem;border-bottom:1px solid var(--border-soft);position:sticky;top:0;
      background:var(--panel);border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
    .modal-header h3{font-size:1.05rem;margin:0;}
    .modal-close{background:none;border:none;color:var(--ink-faint);font-size:1.4rem;line-height:1;
      cursor:pointer;padding:.2rem .5rem;border-radius:8px;}
    .modal-close:hover{color:var(--ink);background:var(--panel-2);}
    .modal-body{padding:1.3rem;}

    @media (max-width:640px){
      .hotspot-row .label{width:120px;}
      .main{padding:1.4rem 1rem 3.5rem;}
    }

  let session = { userId: null };

  function currentUser() { return USERS.find((u) => u.id === session.userId) || null; }

  function setSession(userId) {
    session.userId = userId;

    view = { screen: 'dashboard', gremioId: null, tab: 'historial' };

  function logout() {
    session.userId = null;
    try { sessionStorage.removeItem('gg_user'); } catch (e) {}
    view = { screen: 'login' };
    render();
  }

  function goTo(screen, extra) {
    view = Object.assign({ screen, gremioId: null, tab: 'historial' }, extra || {});
    render();
  }

  function buildFullDocument(s) {
    const json = JSON.stringify(s).replace(/</g, '\\u003c');
    return `<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gestión Gremial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<div id="root"></div>
<script id="app-state" type="application/json">${json}<\/script>
<script>
${App.toString()}
App(JSON.parse(document.getElementById('app-state').textContent));
<\/script>
</body>
</html>`;
  }

  async function persist(mutateFn) {
    const newState = mutateFn(JSON.parse(JSON.stringify(state)));
    state = newState;
    render();
    if (capArtifact) {
      try {
        await capArtifact.publish(buildFullDocument(state));
      } catch (e) {
        toast('No se pudieron guardar los cambios (vista de solo lectura).', true);
      }
    }
  }

  function toast(msg, isError) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4200);
  }

  function formatFecha(iso) {
    try {
      return new Date(iso).toLocaleString('es-EC', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function openModal(title, buildBody) {
    const overlay = el(`<div class="modal-overlay"></div>`);
    const dialog = el(`<div class="modal-dialog">
      <div class="modal-header"><h3>${title}</h3><button type="button" class="modal-close" aria-label="Cerrar">&times;</button></div>
      <div class="modal-body"></div>
    </div>`);
    overlay.appendChild(dialog);
    function close() {
      overlay.remove();
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    dialog.querySelector('.modal-close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    buildBody(dialog.querySelector('.modal-body'), close);
    return { close };
  }

  function speechSupported() {
    return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
  }

  function createDictation({ onResult, onEnd, onError }) {
    const Impl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Impl) return null;
    let recognition;
    try {
      recognition = new Impl();
    } catch (e) { return null; }
    recognition.lang = 'es-EC';
    recognition.continuous = true;
    recognition.interimResults = true;
    let finalText = '';
    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += transcript + ' ';
        else interim += transcript;
      }
      onResult(finalText, interim);
    };
    recognition.onerror = (event) => onError && onError(event.error);
    recognition.onend = () => onEnd && onEnd(finalText);
    return {
      start: () => { finalText = ''; try { recognition.start(); } catch (e) { onError && onError('start_failed'); } },
      stop: () => { try { recognition.stop(); } catch (e) {} },
    };
  }

  function render() {
    root.innerHTML = '';
    if (view.screen === 'login' || !currentUser()) { root.appendChild(renderLogin()); return; }
    const shell = renderShellChrome();
    root.appendChild(shell.wrap);
    const content =
      view.screen === 'gremio' ? renderGremio(shell.main) :
      view.screen === 'admin' ? renderAdmin(shell.main) :
      renderDashboard(shell.main);
  }

  // ---------------- Brand strip (Keyword + Banco Pichincha) ----------------
  function renderBrandStrip(clickable) {
    const strip = el(`<div class="brand-strip">
      <button type="button" class="kw-btn" title="Keyword" aria-label="Ir al inicio">${KEYWORD_LOGO_SVG}</button>
      <div class="bp-badge">${BP_LOGO_SVG}</div>
    </div>`);
    const kwBtn = strip.querySelector('.kw-btn');
    if (clickable) kwBtn.addEventListener('click', () => goTo('dashboard'));
    else kwBtn.style.cursor = 'default';
    return strip;
  }

  // ---------------- Login ----------------
  function renderLogin() {
    const page = el(`<div class="login-page"></div>`);
    page.appendChild(el(`<div class="bg-video-wrap">
      <video class="bg-video" autoplay muted loop playsinline preload="auto">
        <source src="/_blob/a73e7de5c9d88f6dd7076b4ef14cc0c5" type="video/mp4">
      </video>
      <div class="bg-video-fade"></div>
    </div>`));
    page.appendChild(renderBrandStrip(false));
    const screen = el(`<div class="login-screen"><div class="login-card">
      <h1>Gestión Gremial</h1>
      <div class="login-sub">Banco Pichincha · acceso interno Keyword</div>
      <form id="login-form">

    const form = screen.querySelector('#login-form');
    const errorEl = screen.querySelector('#login-error');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = screen.querySelector('#login-email').value.trim().toLowerCase();
      const password = screen.querySelector('#login-password').value;
      if (!password) {
        errorEl.textContent = 'Ingresa una contraseña.';
        errorEl.classList.add('visible');
        return;
      }
      const user = USERS.find((u) => u.email.toLowerCase() === email);
      if (!user) {
        errorEl.textContent = 'No encontramos ese usuario en este prototipo. Usa uno de los accesos de prueba de abajo.';

      }
      errorEl.classList.remove('visible');
      setSession(user.id);
    });

    const qaRow = screen.querySelector('#qa-row');
    USERS.forEach((u) => {
      const chip = el(`<button type="button" class="qa-chip"><span class="avatar">${u.iniciales}</span>${u.nombre.split(' ')[0]}</button>`);
      chip.addEventListener('click', () => setSession(u.id));

  // ---------------- Shell (topbar + tabs) ----------------
  function renderShellChrome() {
    const u = currentUser();
    const admin = isAdmin();
    const wrap = el(`<div class="app-shell">
      <div class="topbar">
        <div class="topbar-user">
          <span class="badge ${admin ? 'badge-admin' : 'badge-delegado'}">${admin ? 'Administradora' : 'Delegado'}</span>
          <button type="button" class="avatar-btn" id="avatar-btn" aria-haspopup="true" aria-expanded="false" title="${u.nombre}">
            <span class="avatar">${u.iniciales}</span>
          </button>
          <div class="user-menu" id="user-menu" hidden>
            <div class="user-menu-name">${u.nombre}</div>
            <button type="button" class="user-menu-item" id="logout-item">Cerrar sesión</button>
          </div>
        </div>
      </div>
      <div class="nav-tabs" id="nav-tabs"></div>
      <div class="main" id="main-content"></div>
    </div>`);
    wrap.insertBefore(renderBrandStrip(true), wrap.firstChild);

    const tabs = [{ id: 'dashboard', label: 'Mis gremios' }];
    if (admin) tabs.push({ id: 'admin', label: 'Panel de administración' });
    const navEl = wrap.querySelector('#nav-tabs');
    tabs.forEach((t) => {
      const active = view.screen === t.id || (view.screen === 'gremio' && t.id === 'dashboard');
      const b = el(`<button class="nav-tab ${active ? 'active' : ''}">${t.label}</button>`);
      b.addEventListener('click', () => goTo(t.id));
      navEl.appendChild(b);
    });

    const avatarBtn = wrap.querySelector('#avatar-btn');
    const userMenu = wrap.querySelector('#user-menu');
    function closeMenu() {
      userMenu.hidden = true;
      avatarBtn.setAttribute('aria-expanded', 'false');
      document.removeEventListener('click', onOutsideClick);
    }
    function onOutsideClick(e) {
      if (!userMenu.contains(e.target) && e.target !== avatarBtn && !avatarBtn.contains(e.target)) closeMenu();
    }
    avatarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const willOpen = userMenu.hidden;
      if (willOpen) {
        userMenu.hidden = false;
        avatarBtn.setAttribute('aria-expanded', 'true');
        document.addEventListener('click', onOutsideClick);
      } else {
        closeMenu();
      }
    });
    wrap.querySelector('#logout-item').addEventListener('click', logout);

    return { wrap, main: wrap.querySelector('#main-content') };
  }

  // ---------------- Dashboard ----------------
  function renderDashboard(main) {
    const u = currentUser();
    const gremioIds = state.delegaciones.filter((d) => d.userId === u.id).map((d) => d.gremioId);
    const gremios = state.gremios.filter((g) => gremioIds.includes(g.id));

    main.appendChild(el(`<h1 class="dash-greeting">${u.nombre}</h1>`));
    main.appendChild(el(`<div class="section-title"><h2>Gremios delegados a ti</h2></div>`));

    if (gremios.length === 0) {
      main.appendChild(el(`<div class="empty-state">Aún no tienes gremios asignados en este prototipo. Cambia de usuario para ver otro perfil, o revisa el Panel de administración.</div>`));
      return;
    }
    const grid = el(`<div class="grid"></div>`);
    gremios.forEach((g) => {
      const card = el(`<button type="button" class="card gremio-card">
        <div class="gremio-card-head">
          <div class="gremio-logo-slot"></div>
          <h3>${g.nombre}</h3>
        </div>
        <p>${g.objetivos}</p>
        <span class="estado-pill estado-${g.estado}">${ESTADOS[g.estado]}</span>
      </button>`);
      card.addEventListener('click', () => goTo('gremio', { gremioId: g.id }));
      grid.appendChild(card);
    });
    main.appendChild(grid);
  }

  // ---------------- Ficha de gremio ----------------
  function renderGremio(main) {
    const gremio = state.gremios.find((g) => g.id === view.gremioId);
    if (!gremio) { goTo('dashboard'); return; }

    const back = el(`<button type="button" class="back-link">&larr; Volver a mis gremios</button>`);
    back.addEventListener('click', () => goTo('dashboard'));
    main.appendChild(back);

    main.appendChild(el(`<div class="gremio-header">
      <h2>${gremio.nombre}</h2>
      <p class="objetivos">${gremio.objetivos}</p>
      <span class="estado-pill estado-${gremio.estado}">${ESTADOS[gremio.estado]}</span>
    </div>`));

    const tabsWrap = el(`<div class="tabs-inline">
      <button data-tab="historial">Historial de reuniones</button>
      <button data-tab="nueva">Registrar nueva reunión</button>
      <button data-tab="perfil">Perfil del gremio</button>
    </div>`);
    main.appendChild(tabsWrap);
    const tabContent = el(`<div id="tab-content"></div>`);
    main.appendChild(tabContent);

    Array.from(tabsWrap.children).forEach((b) => {
      if (b.dataset.tab === 'nueva') {
        b.addEventListener('click', () => {
          openModal('Registrar nueva reunión', (body, close) => renderNuevaReunion(body, gremio, close));
        });
        return;
      }
      b.classList.toggle('active', b.dataset.tab === view.tab);
      b.addEventListener('click', () => { view.tab = b.dataset.tab; render(); });
    });

    if (view.tab === 'perfil') renderPerfilGremio(tabContent, gremio);
    else renderHistorial(tabContent, gremio);
  }

  function renderPerfilGremio(tabContent, gremio) {
    const stats = [
      gremio.nombreCompleto && gremio.nombreCompleto !== gremio.nombre ? { label: 'Nombre completo', value: gremio.nombreCompleto } : null,
      gremio.nivelPrioridad ? { label: 'Nivel de prioridad', pill: gremio.nivelPrioridad } : null,
      gremio.periodicidadReuniones ? { label: 'Periodicidad de reuniones', value: gremio.periodicidadReuniones } : null,
      gremio.renovacionDirectorio ? { label: 'Renovación del directorio', value: gremio.renovacionDirectorio } : null,
    ].filter(Boolean);

    if (stats.length) {
      const grid = el(`<div class="perfil-grid"></div>`);
      stats.forEach((s) => {
        const tile = el(`<div class="perfil-stat"><div class="p-label">${s.label}</div></div>`);
        if (s.pill) {
          tile.appendChild(el(`<span class="prioridad-pill prioridad-${s.pill}">${PRIORIDADES[s.pill] || s.pill}</span>`));
        } else {
          tile.appendChild(el(`<div class="p-value">${s.value}</div>`));
        }
        grid.appendChild(tile);
      });
      tabContent.appendChild(grid);
    }

    if (gremio.champions && gremio.champions.length) {
      const section = el(`<div class="perfil-section"><h4>Champion</h4></div>`);
      const row = el(`<div class="champion-row"></div>`);
      gremio.champions.forEach((name) => {
        const initials = name.split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
        row.appendChild(el(`<span class="champion-chip"><span class="avatar">${initials || '?'}</span>${name}</span>`));
      });
      section.appendChild(row);
      tabContent.appendChild(section);
    }

    const proseFields = [
      ['Perfil institucional', gremio.perfilInstitucional],
      ['Metas', gremio.metas],
      ['Valor estratégico para el Banco', gremio.valorEstrategico],
    ];
    proseFields.forEach(([label, value]) => {
      if (!value) return;
      tabContent.appendChild(el(`<div class="perfil-section"><h4>${label}</h4><p>${value}</p></div>`));
    });

    if (gremio.temasPriorizados && gremio.temasPriorizados.length) {
      const section = el(`<div class="perfil-section"><h4>Temas priorizados</h4></div>`);
      const row = el(`<div class="chip-row"></div>`);
      gremio.temasPriorizados.forEach((t) => row.appendChild(el(`<span class="chip">${t}</span>`)));
      section.appendChild(row);
      tabContent.appendChild(section);
    }

    if (gremio.comites && gremio.comites.length) {
      const section = el(`<div class="perfil-section"><h4>Comités / espacios en los que participa</h4></div>`);
      const list = el(`<ul class="comites-list"></ul>`);
      gremio.comites.forEach((c) => list.appendChild(el(`<li>${c}</li>`)));
      section.appendChild(list);
      tabContent.appendChild(section);
    }

    if (!tabContent.children.length) {
      tabContent.appendChild(el(`<div class="empty-state">Todavía no hay información de perfil cargada para este gremio.</div>`));
    }
  }

  function renderHistorial(tabContent, gremio, editingId) {
    tabContent.innerHTML = '';
    const list = state.reuniones.filter((r) => r.gremioId === gremio.id).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
    if (list.length === 0) {
      tabContent.appendChild(el(`<div class="empty-state">Todavía no hay reuniones registradas para este gremio.</div>`));
      return;
    }
    list.forEach((r) => {
      const autor = USERS.find((u) => u.id === r.userId);
      const isEditing = r.id === editingId;
      const field = r.resumenIA ? 'resumenIA' : 'notasTexto';
      const text = r[field] || '';
      const temasHtml = (r.temas || []).map((t) => `<span class="chip chip-tema">${t}</span>`).join('');
      const pasosHtml = (r.proximosPasos || []).map((p) => `<span class="chip chip-paso">${p}</span>`).join('');
      const item = el(`<div class="meeting-item">
        <div class="meeting-item-top">
          <div class="meta">${formatFecha(r.fecha)} · ${r.duracionMinutos} min · registrado por ${autor ? autor.nombre : '—'}</div>
          ${isEditing ? '' : '<button type="button" class="icon-btn edit-meeting-btn" title="Editar texto">&#9998;</button>'}
        </div>
        ${isEditing
          ? `<textarea class="edit-textarea">${escapeHtml(text)}</textarea>
             <div class="form-actions" style="margin-top:0;">
               <button type="button" class="btn btn-primary btn-sm save-edit-btn">Guardar</button>
               <button type="button" class="btn btn-ghost btn-sm cancel-edit-btn">Cancelar</button>
             </div>`
          : `<div class="resumen">${text}</div>
             ${temasHtml ? `<div class="chip-row" style="margin-bottom:.4rem;">${temasHtml}</div>` : ''}
             ${pasosHtml ? `<div class="chip-row">${pasosHtml}</div>` : ''}`
        }
      </div>`);

      if (isEditing) {
        item.querySelector('.save-edit-btn').addEventListener('click', () => {
          const newText = item.querySelector('.edit-textarea').value.trim();
          if (!newText) { toast('El texto no puede quedar vacío.', true); return; }
          persist((s) => {
            const rec = s.reuniones.find((x) => x.id === r.id);
            if (rec) rec[field] = newText;
            return s;
          });
        });
        item.querySelector('.cancel-edit-btn').addEventListener('click', () => renderHistorial(tabContent, gremio, null));
      } else {
        item.querySelector('.edit-meeting-btn').addEventListener('click', () => renderHistorial(tabContent, gremio, r.id));
      }

      tabContent.appendChild(item);
    });
  }

  function renderNuevaReunion(modalBody, gremio, close) {
    const supportsVoice = speechSupported();
    const card = el(`<div>
      <div class="field">
        <label for="notas-input">Notas de la reunión</label>
        <div class="voice-row">
          ${supportsVoice ? `<button type="button" class="mic-btn" id="mic-btn" title="Dictar por voz">&#127908;</button>` : ''}
          <span class="voice-hint">${supportsVoice ? 'Dicta o escribe las notas de la reunión.' : 'Dictado por voz no disponible en este navegador — escribe las notas manualmente.'}</span>
        </div>
        <textarea id="notas-input" rows="7" placeholder="Escribe o dicta las notas de la reunión…"></textarea>
      </div>
      <div class="field duracion-field">
        <label for="duracion-input">Duración (minutos)</label>
        <input id="duracion-input" type="number" min="0" step="5" placeholder="60" />
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="generar-btn">Generar ficha-resumen con IA</button>
        <button class="btn btn-secondary" id="guardar-btn">Guardar sin resumen IA</button>
      </div>
      <div id="summary-area"></div>
    </div>`);
    modalBody.appendChild(card);

    const notasEl = card.querySelector('#notas-input');
    const micBtn = card.querySelector('#mic-btn');

    if (micBtn) {
      let dictation = null, recording = false, baseText = '';
      micBtn.addEventListener('click', () => {
        if (!recording) {
          baseText = notasEl.value ? notasEl.value + ' ' : '';
          dictation = createDictation({
            onResult: (finalText, interim) => { notasEl.value = baseText + finalText + interim; },
            onEnd: (finalText) => { notasEl.value = baseText + finalText; micBtn.classList.remove('recording'); recording = false; },
            onError: (err) => { toast('No se pudo usar el dictado por voz aquí (' + err + '). Escribe las notas manualmente.', true); micBtn.classList.remove('recording'); recording = false; },
          });
          if (!dictation) { toast('El dictado por voz no está disponible en este contexto.', true); return; }
          dictation.start();
          micBtn.classList.add('recording');
          recording = true;
        } else {
          dictation.stop();
        }
      });
    }

    function saveReunion({ resumen, temas, proximosPasos }) {
      const notasTexto = notasEl.value.trim();
      const duracionMinutos = Number(card.querySelector('#duracion-input').value) || 0;
      if (!notasTexto) { toast('Escribe o dicta las notas antes de guardar.', true); return; }
      persist((s) => {
        s.reuniones.push({
          id: 'r-' + Date.now(),
          gremioId: gremio.id,
          userId: currentUser().id,
          fecha: new Date().toISOString(),
          duracionMinutos,
          notasTexto,
          resumenIA: resumen || null,
          temas: temas || [],
          proximosPasos: proximosPasos || [],
        });
        return s;
      });
      close();
      toast('Reunión registrada.');
      view.tab = 'historial';
      render();
    }

    card.querySelector('#guardar-btn').addEventListener('click', () => saveReunion({}));

    const generarBtn = card.querySelector('#generar-btn');
    if (!capSample) generarBtn.title = capsReady ? 'Generación con IA no disponible en esta vista' : 'Cargando…';

    generarBtn.addEventListener('click', async () => {
      const notasTexto = notasEl.value.trim();
      if (!notasTexto) { toast('Escribe o dicta las notas antes de generar la ficha.', true); return; }
      if (!capSample) { toast('La generación con IA no está disponible en este contexto. Puedes guardar la nota sin resumen.', true); return; }
      const duracionMinutos = Number(card.querySelector('#duracion-input').value) || 0;
      generarBtn.disabled = true;
      generarBtn.textContent = 'Generando ficha-resumen…';
      try {
        const prompt = `Eres un asistente que resume notas de reuniones gremiales para un banco.\nGremio: ${gremio.nombre}\nDuración de la reunión: ${duracionMinutos} minutos\n\nNotas de la reunión (texto manual o transcripción de voz, puede tener errores de dictado):\n"""\n${notasTexto}\n"""\n\nDevuelve EXCLUSIVAMENTE un objeto JSON con esta forma exacta, sin texto adicional:\n{"resumen": "resumen ejecutivo en 2-4 oraciones", "temas": ["tema 1", "tema 2"], "proximos_pasos": ["paso 1", "paso 2"]}`;
        const data = await capSample.json(prompt, { modelTier: 'quick' });
        const summaryArea = card.querySelector('#summary-area');
        summaryArea.innerHTML = '';
        const temasHtml = (data.temas || []).map((t) => `<span class="chip chip-tema">${t}</span>`).join('');
        const pasosHtml = (data.proximos_pasos || []).map((p) => `<span class="chip chip-paso">${p}</span>`).join('');
        const preview = el(`<div class="summary-preview">
          <h4>Ficha-resumen generada</h4>
          <p>${data.resumen || ''}</p>
          ${temasHtml ? `<div class="chip-row" style="margin-bottom:.5rem;">${temasHtml}</div>` : ''}
          ${pasosHtml ? `<div class="chip-row" style="margin-bottom:.8rem;">${pasosHtml}</div>` : ''}
          <button class="btn btn-primary" id="confirmar-btn">Guardar reunión con esta ficha</button>
        </div>`);
        summaryArea.appendChild(preview);
        preview.querySelector('#confirmar-btn').addEventListener('click', () =>
          saveReunion({ resumen: data.resumen, temas: data.temas || [], proximosPasos: data.proximos_pasos || [] })
        );
      } catch (err) {
        toast('No se pudo generar la ficha-resumen: ' + (err && err.message ? err.message : 'error desconocido'), true);
      } finally {
        generarBtn.disabled = false;
        generarBtn.textContent = 'Generar ficha-resumen con IA';
      }
    });
  }

  // ---------------- Admin ----------------
  function renderAdmin(main) {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const reunionesMes = state.reuniones.filter((r) => new Date(r.fecha) >= monthStart);
    const horasMes = reunionesMes.reduce((sum, r) => sum + (r.duracionMinutos || 0), 0) / 60;
    const gremiosEnSeguimiento = state.gremios.filter((g) => g.estado === 'activo').length;
    const personasDelegadas = new Set(state.delegaciones.map((d) => d.userId)).size;

    const temaCounts = new Map();
    state.reuniones.forEach((r) => (r.temas || []).forEach((t) => temaCounts.set(t, (temaCounts.get(t) || 0) + 1)));
    const topTemas = [...temaCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
    const maxCount = topTemas.length ? topTemas[0][1] : 1;

    main.appendChild(el(`<div class="section-title"><h2>Panel de administración</h2></div>`));
    main.appendChild(el(`<div class="stat-grid">
      <div class="stat-card"><div class="value">${reunionesMes.length}</div><div class="label">Reuniones este mes</div></div>
      <div class="stat-card"><div class="value">${horasMes.toFixed(1)}</div><div class="label">Horas dedicadas este mes</div></div>
      <div class="stat-card"><div class="value">${personasDelegadas}</div><div class="label">Personas delegadas</div></div>
      <div class="stat-card"><div class="value">${gremiosEnSeguimiento}</div><div class="label">Gremios en seguimiento</div></div>
    </div>`));

    main.appendChild(el(`<div class="section-title"><h2>Temas más tratados (histórico)</h2></div>`));
    const hotspotCard = el(`<div class="card"></div>`);
    if (topTemas.length === 0) {
      hotspotCard.appendChild(el(`<div class="empty-state">Aún no hay temas registrados en reuniones.</div>`));
    } else {
      topTemas.forEach(([tema, count]) => {
        hotspotCard.appendChild(el(`<div class="hotspot-row">
          <span class="label">${tema}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${(count / maxCount) * 100}%"></span></span>
          <span class="count">${count}</span>
        </div>`));
      });
    }
    main.appendChild(hotspotCard);
  }

  render();
}

App(JSON.parse(document.getElementById('app-state').textContent));
</script>
