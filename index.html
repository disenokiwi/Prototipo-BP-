  function adminIconHtml(key) {
    const svg = ADMIN_ICONS[key];
    return svg ? `<span class="stat-card-icon">${svg}</span>` : '';
  }

  let session = { userId: null };
  try { session.userId = sessionStorage.getItem('gg_user') || null; } catch (e) {}

  let view = { screen: session.userId ? 'dashboard' : 'login', gremioId: null, tab: 'historial' };

  const root = document.getElementById('root');

  let capArtifact = null;
  let capSample = null;
  let capsReady = false;
  (async () => {
    try { capArtifact = window.claude ? await window.claude.use('artifact') : null; } catch (e) { capArtifact = null; }
    try { capSample = window.claude ? await window.claude.use('sample') : null; } catch (e) { capSample = null; }
    capsReady = true;
    render();
  })();

  function currentUser() { return USERS.find((u) => u.id === session.userId) || null; }
  function isAdmin() { return currentUser()?.rol === 'administradora'; }

  function setSession(userId) {
    session.userId = userId;
    try { sessionStorage.setItem('gg_user', userId); } catch (e) {}
    view = { screen: 'dashboard', gremioId: null, tab: 'historial' };
    render();
  }

  function logout() {
    session.userId = null;
    try { sessionStorage.removeItem('gg_user'); } catch (e) {}
    view = { screen: 'login' };
    render();
  }

  function goTo(screen, extra) {
    view = Object.assign({ screen, gremioId: null, tab: 'historial' }, extra || {});
    render();
  }

  function buildFullDocument(s) {
    const json = JSON.stringify(s).replace(/</g, '\\u003c');
    return `<!doctype html>

  }

  async function persist(mutateFn) {
    const newState = mutateFn(JSON.parse(JSON.stringify(state)));
    state = newState;
    render();
    if (capArtifact) {
      try {
        await capArtifact.publish(buildFullDocument(state));
      } catch (e) {
        toast('No se pudieron guardar los cambios (vista de solo lectura).', true);
      }
    }
  }

  function toast(msg, isError) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4200);
  }

  function formatFecha(iso) {
    try {
      return new Date(iso).toLocaleString('es-EC', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function heatColor(ratio) {
    const stops = [
      { r: 205, g: 176, b: 255 }, // lavender — bajo
      { r: 202, g: 67, b: 233 },  // pink — medio
      { r: 255, g: 191, b: 94 },  // orange — alto
    ];
    const t = Math.max(0, Math.min(1, ratio)) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(t));
    const f = t - i;
    const a = stops[i], b = stops[i + 1];
    const r = Math.round(a.r + (b.r - a.r) * f);
    const g = Math.round(a.g + (b.g - a.g) * f);
    const bl = Math.round(a.b + (b.b - a.b) * f);
    return `rgb(${r},${g},${bl})`;
  }

  function openModal(title, buildBody) {
    const titleId = 'modal-title-' + Date.now();
    const overlay = el(`<div class="modal-overlay"></div>`);
    const dialog = el(`<div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="${titleId}">
      <div class="modal-header"><h3 id="${titleId}">${title}</h3><button type="button" class="modal-close" aria-label="Cerrar">&times;</button></div>
      <div class="modal-body"></div>
    </div>`);
    overlay.appendChild(dialog);
    const previouslyFocused = document.activeElement;
    function close() {
      overlay.remove();
      document.removeEventListener('keydown', onKey);
      if (previouslyFocused && previouslyFocused.focus) previouslyFocused.focus();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    dialog.querySelector('.modal-close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    buildBody(dialog.querySelector('.modal-body'), close);
    const firstField = dialog.querySelector('.modal-body textarea, .modal-body input') || dialog.querySelector('.modal-body button');
    if (firstField) firstField.focus();
    return { close };
  }

  function openConfirm(message, confirmLabel, onConfirm) {
    const { close } = openModal('Confirmar', (body) => {
      body.appendChild(el(`<p style="margin:0 0 1.2rem;color:var(--ink-dim);line-height:1.5;">${escapeHtml(message)}</p>`));
      const actions = el(`<div class="form-actions" style="margin-top:0;">
        <button type="button" class="btn btn-sm confirm-yes-btn" style="background:var(--cerrado-text);color:#fff;">${escapeHtml(confirmLabel)}</button>
        <button type="button" class="btn btn-ghost btn-sm confirm-no-btn">Cancelar</button>
      </div>`);
      body.appendChild(actions);
      actions.querySelector('.confirm-yes-btn').addEventListener('click', () => { close(); onConfirm(); });
      actions.querySelector('.confirm-no-btn').addEventListener('click', () => close());
    });
  }

  function speechSupported() {
    return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
  }

  function createDictation({ onResult, onEnd, onError }) {
    const Impl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Impl) return null;
    let recognition;
    try {
      recognition = new Impl();
    } catch (e) { return null; }
    recognition.lang = 'es-EC';
    recognition.continuous = true;
    recognition.interimResults = true;
    let finalText = '';
    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += transcript + ' ';
        else interim += transcript;
      }
      onResult(finalText, interim);
    };
    recognition.onerror = (event) => onError && onError(event.error);
    recognition.onend = () => onEnd && onEnd(finalText);
    return {
      start: () => { finalText = ''; try { recognition.start(); } catch (e) { onError && onError('start_failed'); } },
      stop: () => { try { recognition.stop(); } catch (e) {} },
    };
  }

  function render() {
    root.innerHTML = '';
    if (view.screen === 'login' || !currentUser()) { root.appendChild(renderLogin()); setDashboardBg(false); return; }
    setDashboardBg(view.screen === 'dashboard');
    const shell = renderShellChrome();
    root.appendChild(shell.wrap);
    const content =
      view.screen === 'gremio' ? renderGremio(shell.main) :
      view.screen === 'admin' ? renderAdmin(shell.main) :
      renderDashboard(shell.main);
  }

  function setDashboardBg(active) {
    let bgEl = document.getElementById('dashboard-bg-layer');
    document.body.classList.toggle('has-dashboard-bg', active);
    if (active) {
      if (!bgEl) {
        bgEl = document.createElement('div');
        bgEl.id = 'dashboard-bg-layer';
        document.body.insertBefore(bgEl, document.body.firstChild);
      }
      bgEl.style.backgroundImage = `url('${DASHBOARD_BG_URL}')`;
    } else if (bgEl) {
      bgEl.remove();
    }
  }

  // ---------------- Brand strip (Keyword + Banco Pichincha) ----------------
  function getEffectiveTheme() {
    const forced = document.documentElement.getAttribute('data-theme');
    if (forced === 'light' || forced === 'dark') return forced;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  function renderBrandStrip(clickable) {
    const strip = el(`<div class="brand-strip">
      <button type="button" class="kw-btn" title="Keyword" aria-label="Ir al inicio">${KEYWORD_LOGO_SVG}</button>
      <div class="brand-strip-right"></div>
    </div>`);
    const right = strip.querySelector('.brand-strip-right');

    if (clickable) {
      const dark = getEffectiveTheme() === 'dark';
      const themeBtn = el(`<button type="button" class="theme-toggle-btn" id="theme-toggle-btn"
        title="Solo para probar este prototipo — la versión final se adapta sola al modo del dispositivo, sin botón"
        aria-label="Cambiar entre modo claro y oscuro (solo para pruebas)">${dark ? '☀️ Claro' : '🌙 Oscuro'}</button>`);
      themeBtn.addEventListener('click', () => {
        const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('gg_theme_override', next); } catch (e) {}
        render();
      });
      right.appendChild(themeBtn);

      const mobileBtn = el(`<button type="button" class="theme-toggle-btn" id="mobile-preview-btn"
        title="Solo para probar este prototipo — la versión final ya es responsive sola, sin este botón"
        aria-label="Ver vista móvil (solo para pruebas)">📱 Vista móvil</button>`);
      mobileBtn.addEventListener('click', () => {
        openModal('Vista móvil · prototipo', (body) => {
          body.style.padding = '0';
          const frameWrap = el(`<div class="mobile-preview-frame-wrap">
            <div class="mobile-preview-frame"><iframe title="Vista previa móvil"></iframe></div>
          </div>`);
          body.appendChild(frameWrap);
          frameWrap.querySelector('iframe').srcdoc = buildFullDocument(state);
        });
      });
      right.appendChild(mobileBtn);
    }
    right.appendChild(el(`<div class="bp-badge">${BP_LOGO_SVG}</div>`));

    const kwBtn = strip.querySelector('.kw-btn');
    if (clickable) kwBtn.addEventListener('click', () => goTo('dashboard'));
    else kwBtn.style.cursor = 'default';
    return strip;
  }

      const password = screen.querySelector('#login-password').value;
      if (!password) {
        errorEl.textContent = 'Ingresa una contraseña.';
        errorEl.classList.add('visible');
        return;
      }
      const user = USERS.find((u) => u.email.toLowerCase() === email);
      if (!user) {
        errorEl.textContent = 'No encontramos ese usuario en este prototipo. Usa uno de los accesos de prueba de abajo.';
        errorEl.classList.add('visible');
        return;
      }
      errorEl.classList.remove('visible');
      setSession(user.id);
    });

    const qaRow = screen.querySelector('#qa-row');
    USERS.forEach((u) => {
      const chip = el(`<button type="button" class="qa-chip"><span class="avatar">${u.iniciales}</span>${u.nombre.split(' ')[0]}</button>`);
      chip.addEventListener('click', () => setSession(u.id));
      qaRow.appendChild(chip);
    });

    return page;
  }

  // ---------------- Shell (topbar + tabs) ----------------

    const u = currentUser();
    const admin = isAdmin();
    const wrap = el(`<div class="app-shell">

        <div class="topbar-user">
          <span class="badge ${admin ? 'badge-admin' : 'badge-delegado'}">${admin ? 'Administradora' : 'Delegado'}</span>
          <button type="button" class="avatar-btn" id="avatar-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menú de ${u.nombre}" title="${u.nombre}">

          </div>
        </div>

      <div class="main" id="main-content"></div>
    </div>`);

    const navEl = wrap.querySelector('#nav-tabs');
    navEl.setAttribute('role', 'tablist');
    tabs.forEach((t) => {
      const active = view.screen === t.id || (view.screen === 'gremio' && t.id === 'dashboard');
      const b = el(`<button class="nav-tab ${active ? 'active' : ''}" role="tab" aria-selected="${active}">${t.label}</button>`);
      b.addEventListener('click', () => goTo(t.id));
      navEl.appendChild(b);
    });

    const avatarBtn = wrap.querySelector('#avatar-btn');
    const userMenu = wrap.querySelector('#user-menu');
    function closeMenu() {
      userMenu.hidden = true;
      avatarBtn.setAttribute('aria-expanded', 'false');
      document.removeEventListener('click', onOutsideClick);
    }
    function onOutsideClick(e) {
      if (!userMenu.contains(e.target) && e.target !== avatarBtn && !avatarBtn.contains(e.target)) closeMenu();
    }
    avatarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const willOpen = userMenu.hidden;
      if (willOpen) {
        userMenu.hidden = false;
        avatarBtn.setAttribute('aria-expanded', 'true');
        document.addEventListener('click', onOutsideClick);
      } else {
        closeMenu();
      }
    });
    wrap.querySelector('#logout-item').addEventListener('click', logout);

    return { wrap, main: wrap.querySelector('#main-content') };
  }

  // ---------------- Ficha de gremio ----------------
  function renderGremio(main) {

  function renderPerfilGremio(tabContent, gremio) {
    const stats = [
      gremio.nombreCompleto && gremio.nombreCompleto !== gremio.nombre ? { label: 'Nombre completo', value: gremio.nombreCompleto } : null,
      gremio.nivelPrioridad ? { label: 'Nivel de prioridad', pill: gremio.nivelPrioridad } : null,
      gremio.periodicidadReuniones ? { label: 'Periodicidad de reuniones', value: gremio.periodicidadReuniones } : null,
      gremio.renovacionDirectorio ? { label: 'Renovación del directorio', value: gremio.renovacionDirectorio } : null,
    ].filter(Boolean);

    if (stats.length) {
      const grid = el(`<div class="perfil-grid"></div>`);
      stats.forEach((s) => {
        const tile = el(`<div class="perfil-stat"><div class="p-label">${s.label}</div></div>`);
        if (s.pill) {
          tile.appendChild(el(`<span class="prioridad-pill prioridad-${s.pill}">${PRIORIDADES[s.pill] || s.pill}</span>`));
        } else {
          tile.appendChild(el(`<div class="p-value">${s.value}</div>`));
        }
        grid.appendChild(tile);
      });
      tabContent.appendChild(grid);
    }

    if (gremio.champions && gremio.champions.length) {
      const section = el(`<div class="perfil-section"><h4>${perfilIconHtml('champion')}Champion</h4></div>`);
      const row = el(`<div class="champion-row"></div>`);
      gremio.champions.forEach((name) => {
        const initials = name.split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
        row.appendChild(el(`<span class="champion-chip"><span class="avatar">${initials || '?'}</span>${name}</span>`));
      });
      section.appendChild(row);
      tabContent.appendChild(section);
    }

    const proseFields = [
      ['perfilInstitucional', 'Perfil institucional', gremio.perfilInstitucional],
      ['metas', 'Metas', gremio.metas],
      ['valorEstrategico', 'Valor estratégico para el Banco', gremio.valorEstrategico],
    ];
    proseFields.forEach(([iconKey, label, value]) => {
      if (!value) return;
      tabContent.appendChild(el(`<div class="perfil-section"><h4>${perfilIconHtml(iconKey)}${label}</h4><p>${value}</p></div>`));
    });

    if (gremio.temasPriorizados && gremio.temasPriorizados.length) {
      const section = el(`<div class="perfil-section"><h4>${perfilIconHtml('temasPriorizados')}Temas priorizados</h4></div>`);
      const row = el(`<div class="chip-row"></div>`);
      gremio.temasPriorizados.forEach((t) => row.appendChild(el(`<span class="topic-chip">${t}</span>`)));
      section.appendChild(row);
      tabContent.appendChild(section);
    }

    if (gremio.comites && gremio.comites.length) {
      const section = el(`<div class="perfil-section"><h4>${perfilIconHtml('comites')}Comités / espacios en los que participa</h4></div>`);
      const list = el(`<ul class="comites-list"></ul>`);
      gremio.comites.forEach((c) => list.appendChild(el(`<li>${c}</li>`)));
      section.appendChild(list);
      tabContent.appendChild(section);
    }

    if (!tabContent.children.length) {
      tabContent.appendChild(el(`<div class="empty-state">Todavía no hay información de perfil cargada para este gremio.</div>`));
    }
  }

  function renderHistorial(tabContent, gremio, editingId) {
    tabContent.innerHTML = '';
    const allList = state.reuniones.filter((r) => r.gremioId === gremio.id).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

    if (allList.length === 0) {
      tabContent.appendChild(el(`<div class="empty-state" role="status">
        <span class="empty-icon" aria-hidden="true">📝</span>
        <span class="empty-title">Sin reuniones todavía</span>
        <span class="empty-sub">Registra la primera con "Registrar nueva reunión" y aparecerá aquí.</span>
      </div>`));
      return;
    }

    const searchBar = el(`<div class="field historial-search">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" class="historial-search-input" placeholder="Buscar en el historial de reuniones…"
          value="${escapeHtml(view.historialQuery || '')}" aria-label="Buscar en el historial de reuniones" />
      </div>
    </div>`);
    tabContent.appendChild(searchBar);
    const resultsWrap = el(`<div></div>`);
    tabContent.appendChild(resultsWrap);

    const searchInput = searchBar.querySelector('input');
    searchInput.addEventListener('input', () => {
      view.historialQuery = searchInput.value;
      renderResults();
    });

    function renderResults() {
      resultsWrap.innerHTML = '';
      const q = (view.historialQuery || '').trim().toLowerCase();
      const list = !q ? allList : allList.filter((r) => {
        const autor = USERS.find((u) => u.id === r.userId);
        const haystack = [r.notasTexto, r.resumenIA, autor && autor.nombre, ...(r.temas || []), ...(r.proximosPasos || [])]
          .filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(q);
      });

      if (list.length === 0) {
        resultsWrap.appendChild(el(`<div class="empty-state" role="status">
          <span class="empty-icon" aria-hidden="true">🔎</span>
          <span class="empty-title">Sin resultados</span>
          <span class="empty-sub">Prueba con otro término de búsqueda.</span>
        </div>`));
        return;
      }

      list.forEach((r) => {
        const autor = USERS.find((u) => u.id === r.userId);
        const isEditing = r.id === editingId;
        const field = r.resumenIA ? 'resumenIA' : 'notasTexto';
        const text = r[field] || '';
        const temasHtml = (r.temas || []).map((t) => `<span class="chip chip-tema">${t}</span>`).join('');
        const pasosHtml = (r.proximosPasos || []).map((p) => `<span class="chip chip-paso">${p}</span>`).join('');
        const item = el(`<div class="meeting-item">
          <div class="meeting-item-top">
            <div class="meta">${formatFecha(r.fecha)} · ${r.duracionMinutos} min · registrado por ${autor ? autor.nombre : '—'}</div>
            ${isEditing ? '' : `<div class="meeting-item-actions">
              <button type="button" class="icon-btn edit-meeting-btn" title="Editar texto" aria-label="Editar texto de esta reunión">&#9998;</button>
              <button type="button" class="icon-btn delete-meeting-btn" title="Eliminar reunión" aria-label="Eliminar esta reunión">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              </button>
            </div>`}
          </div>
          ${isEditing
            ? `<textarea class="edit-textarea">${escapeHtml(text)}</textarea>
               <div class="form-actions" style="margin-top:0;">
                 <button type="button" class="btn btn-primary btn-sm save-edit-btn">Guardar</button>
                 <button type="button" class="btn btn-ghost btn-sm cancel-edit-btn">Cancelar</button>
               </div>`
            : `<div class="resumen clamped">${text}</div>
               <button type="button" class="resumen-toggle" hidden>
                 <svg class="chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                 <span>Ver más</span>
               </button>
               ${temasHtml ? `<div class="chip-row" style="margin-bottom:.4rem;">${temasHtml}</div>` : ''}
               ${pasosHtml ? `<div class="chip-row">${pasosHtml}</div>` : ''}`
          }
        </div>`);

        if (!isEditing) {
          const resumenEl = item.querySelector('.resumen');
          const toggleBtn = item.querySelector('.resumen-toggle');
          requestAnimationFrame(() => {
            if (resumenEl.scrollHeight > resumenEl.clientHeight + 2) toggleBtn.hidden = false;
          });
          toggleBtn.addEventListener('click', () => {
            const expanded = toggleBtn.classList.toggle('is-expanded');
            resumenEl.classList.toggle('clamped', !expanded);
            toggleBtn.querySelector('span').textContent = expanded ? 'Ver menos' : 'Ver más';
          });
        }

        if (isEditing) {
          item.querySelector('.save-edit-btn').addEventListener('click', () => {
            const newText = item.querySelector('.edit-textarea').value.trim();
            if (!newText) { toast('El texto no puede quedar vacío.', true); return; }
            persist((s) => {
              const rec = s.reuniones.find((x) => x.id === r.id);
              if (rec) rec[field] = newText;
              return s;
            });
          });
          item.querySelector('.cancel-edit-btn').addEventListener('click', () => renderHistorial(tabContent, gremio, null));
        } else {
          item.querySelector('.edit-meeting-btn').addEventListener('click', () => renderHistorial(tabContent, gremio, r.id));
          item.querySelector('.delete-meeting-btn').addEventListener('click', () => {
            openConfirm('¿Eliminar esta reunión? Esta acción no se puede deshacer.', 'Eliminar', () => {
              persist((s) => {
                s.reuniones = s.reuniones.filter((x) => x.id !== r.id);
                return s;
              });
              toast('Reunión eliminada.');
            });
          });
        }

        resultsWrap.appendChild(item);
      });
    }

    renderResults();
  }

  function renderNuevaReunion(modalBody, gremio, close) {
    const supportsVoice = speechSupported();
    const card = el(`<div>
      <div class="field">
        <label for="notas-input">Notas de la reunión</label>
        <div class="voice-row">
          ${supportsVoice ? `<button type="button" class="mic-btn" id="mic-btn" title="Dictar por voz" aria-label="Dictar por voz" aria-pressed="false">&#127908;</button>` : ''}
          <span class="voice-hint">${supportsVoice ? 'Dicta o escribe las notas de la reunión.' : 'Dictado por voz no disponible en este navegador — escribe las notas manualmente.'}</span>
        </div>
        <textarea id="notas-input" rows="7" placeholder="Escribe o dicta las notas de la reunión…"></textarea>
      </div>
      <div class="field duracion-field">
        <label for="duracion-input">Duración (minutos)</label>
        <input id="duracion-input" type="number" min="0" step="5" placeholder="60" />
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="generar-btn">Generar ficha-resumen con IA</button>
        <button class="btn btn-secondary" id="guardar-btn">Guardar sin resumen IA</button>
      </div>
      <div id="summary-area"></div>
    </div>`);
    modalBody.appendChild(card);

    const notasEl = card.querySelector('#notas-input');
    const micBtn = card.querySelector('#mic-btn');

    if (micBtn) {
      let dictation = null, recording = false, baseText = '';
      micBtn.addEventListener('click', () => {
        if (!recording) {
          baseText = notasEl.value ? notasEl.value + ' ' : '';
          dictation = createDictation({
            onResult: (finalText, interim) => { notasEl.value = baseText + finalText + interim; },
            onEnd: (finalText) => { notasEl.value = baseText + finalText; micBtn.classList.remove('recording'); micBtn.setAttribute('aria-pressed', 'false'); recording = false; },
            onError: (err) => { toast('No se pudo usar el dictado por voz aquí (' + err + '). Escribe las notas manualmente.', true); micBtn.classList.remove('recording'); micBtn.setAttribute('aria-pressed', 'false'); recording = false; },
          });
          if (!dictation) { toast('El dictado por voz no está disponible en este contexto.', true); return; }
          dictation.start();
          micBtn.classList.add('recording');
          micBtn.setAttribute('aria-pressed', 'true');
          recording = true;
        } else {
          dictation.stop();
        }
      });
    }

    function saveReunion({ resumen, temas, proximosPasos }) {
      const notasTexto = notasEl.value.trim();
      const duracionMinutos = Number(card.querySelector('#duracion-input').value) || 0;
      if (!notasTexto) { toast('Escribe o dicta las notas antes de guardar.', true); return; }
      persist((s) => {
        s.reuniones.push({
          id: 'r-' + Date.now(),
          gremioId: gremio.id,
          userId: currentUser().id,
          fecha: new Date().toISOString(),
          duracionMinutos,
          notasTexto,
          resumenIA: resumen || null,
          temas: temas || [],
          proximosPasos: proximosPasos || [],
        });
        return s;
      });
      close();
      toast('Reunión registrada.');
      view.tab = 'historial';
      render();
    }

    card.querySelector('#guardar-btn').addEventListener('click', () => saveReunion({}));

    const generarBtn = card.querySelector('#generar-btn');
    if (!capSample) generarBtn.title = capsReady ? 'Generación con IA no disponible en esta vista' : 'Cargando…';

    generarBtn.addEventListener('click', async () => {
      const notasTexto = notasEl.value.trim();
      if (!notasTexto) { toast('Escribe o dicta las notas antes de generar la ficha.', true); return; }
      if (!capSample) { toast('La generación con IA no está disponible en este contexto. Puedes guardar la nota sin resumen.', true); return; }
      const duracionMinutos = Number(card.querySelector('#duracion-input').value) || 0;
      generarBtn.disabled = true;
      generarBtn.textContent = 'Generando ficha-resumen…';
      const summaryArea0 = card.querySelector('#summary-area');
      summaryArea0.innerHTML = '';
      summaryArea0.appendChild(el(`<div class="summary-preview" aria-live="polite" aria-busy="true">
        <div class="skeleton skeleton-line" style="width:40%;"></div>
        <div class="skeleton skeleton-line" style="width:92%;"></div>
        <div class="skeleton skeleton-line" style="width:78%;"></div>
        <div style="margin-top:var(--space-2);">
          <span class="skeleton skeleton-chip"></span><span class="skeleton skeleton-chip"></span>
        </div>
      </div>`));
      try {
        const prompt = `Eres un asistente que resume notas de reuniones gremiales para un banco.\nGremio: ${gremio.nombre}\nDuración de la reunión: ${duracionMinutos} minutos\n\nNotas de la reunión (texto manual o transcripción de voz, puede tener errores de dictado):\n"""\n${notasTexto}\n"""\n\nDevuelve EXCLUSIVAMENTE un objeto JSON con esta forma exacta, sin texto adicional:\n{"resumen": "resumen ejecutivo en 2-4 oraciones", "temas": ["tema 1", "tema 2"], "proximos_pasos": ["paso 1", "paso 2"]}`;
        const data = await capSample.json(prompt, { modelTier: 'quick' });
        const summaryArea = card.querySelector('#summary-area');
        summaryArea.innerHTML = '';
        const temasHtml = (data.temas || []).map((t) => `<span class="chip chip-tema">${t}</span>`).join('');
        const pasosHtml = (data.proximos_pasos || []).map((p) => `<span class="chip chip-paso">${p}</span>`).join('');
        const preview = el(`<div class="summary-preview">
          <h4>Ficha-resumen generada</h4>
          <p>${data.resumen || ''}</p>
          ${temasHtml ? `<div class="chip-row" style="margin-bottom:.5rem;">${temasHtml}</div>` : ''}
          ${pasosHtml ? `<div class="chip-row" style="margin-bottom:.8rem;">${pasosHtml}</div>` : ''}
          <button class="btn btn-primary" id="confirmar-btn">Guardar reunión con esta ficha</button>
        </div>`);
        summaryArea.appendChild(preview);
        preview.querySelector('#confirmar-btn').addEventListener('click', () =>
          saveReunion({ resumen: data.resumen, temas: data.temas || [], proximosPasos: data.proximos_pasos || [] })
        );
      } catch (err) {
        toast('No se pudo generar la ficha-resumen: ' + (err && err.message ? err.message : 'error desconocido'), true);
      } finally {
        generarBtn.disabled = false;
        generarBtn.textContent = 'Generar ficha-resumen con IA';
      }
    });
  }

  // ---------------- Admin ----------------
  function renderAdmin(main) {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const reunionesMes = state.reuniones.filter((r) => new Date(r.fecha) >= monthStart);
    const horasMes = reunionesMes.reduce((sum, r) => sum + (r.duracionMinutos || 0), 0) / 60;
    const gremiosEnSeguimiento = state.gremios.filter((g) => g.estado === 'activo').length;
    const personasDelegadas = new Set(state.delegaciones.map((d) => d.userId)).size;

    const temaCounts = new Map();
    state.reuniones.forEach((r) => (r.temas || []).forEach((t) => temaCounts.set(t, (temaCounts.get(t) || 0) + 1)));
    const topTemas = [...temaCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
    const maxCount = topTemas.length ? topTemas[0][1] : 1;

    main.appendChild(el(`<h1 class="dash-greeting">Panel de administración</h1>`));
    main.appendChild(el(`<div class="stat-grid">
      <div class="stat-card"><div><div class="value">${reunionesMes.length}</div><div class="label">Reuniones este mes</div></div>${adminIconHtml('reuniones')}</div>
      <div class="stat-card"><div><div class="value">${horasMes.toFixed(1)}</div><div class="label">Horas dedicadas este mes</div></div>${adminIconHtml('horas')}</div>
      <div class="stat-card"><div><div class="value">${personasDelegadas}</div><div class="label">Personas delegadas</div></div>${adminIconHtml('personas')}</div>
      <div class="stat-card"><div><div class="value">${gremiosEnSeguimiento}</div><div class="label">Gremios en seguimiento</div></div>${adminIconHtml('gremios')}</div>
    </div>`));

    main.appendChild(el(`<div class="section-title"><h2>Temas más tratados (histórico)</h2></div>`));
    const hotspotCard = el(`<div class="card"></div>`);
    if (topTemas.length === 0) {
      hotspotCard.appendChild(el(`<div class="empty-state" role="status">
        <span class="empty-icon" aria-hidden="true">📊</span>
        <span class="empty-title">Aún no hay temas registrados</span>
        <span class="empty-sub">Aparecerán aquí a medida que se registren reuniones con temas.</span>
      </div>`));
    } else {
      topTemas.forEach(([tema, count]) => {
        const ratio = count / maxCount;
        const fillBg = `linear-gradient(90deg, ${heatColor(Math.max(0, ratio - 0.25))}, ${heatColor(ratio)})`;
        hotspotCard.appendChild(el(`<div class="hotspot-row">
          <span class="label">${tema}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${ratio * 100}%;background:${fillBg}"></span></span>
          <span class="count">${count}</span>
        </div>`));
      });
    }
    main.appendChild(hotspotCard);
  }

  render();
}

App(JSON.parse(document.getElementById('app-state').textContent));
</script>
</body>
</html>
